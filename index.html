<meta charset="UTF-8" />

<title>3GPP Meeting Slots — Invitation Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --ink: #23241f;
    --muted: #77786f;
    --line: #e6e5df;
    --line-strong: #cdccc6;
    --accent: #b6532c;      /* clay — used ONLY for the "next meeting" marker */

    /* TSG family colors. Each working-group badge is tinted by its TSG so a
       delegate can scan a slot and instantly see the RAN / SA / CT mix. */
    --ran:     #3d6299;  --ran-bg:  #dde4f0;  --ran-fg:  #23395e;
    --sa:      #2d7569;  --sa-bg:   #d8ebe6;  --sa-fg:   #154037;
    --ct:      #8a5a2b;  --ct-bg:   #efe2d0;  --ct-fg:   #4d3216;

    --ok:      #2d7569;  /* invitation present */
    --wait:    #a9a89f;  /* invitation not yet out */
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .header-inner { max-width: 880px; margin: 0 auto; }
  h1 {
    margin: 0 0 6px;
    font-size: 22px; font-weight: 700; letter-spacing: -0.015em;
  }
  h1 .mono { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
  .tagline { color: var(--muted); font-size: 13px; max-width: 60ch; }
  .meta {
    margin-top: 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; color: var(--muted);
  }
  .meta .dot { margin: 0 7px; opacity: 0.5; }

  main { max-width: 880px; margin: 0 auto; padding: 24px 24px 80px; }

  /* Slot card. The whole page is a vertical stack of these. */
  .slot {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .slot.next { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

  .slot-head {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    background: #faf9f4;
  }
  .slot-city { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .slot-dates {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; color: var(--muted);
  }
  .slot-count {
    margin-left: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; color: var(--muted);
    white-space: nowrap;
  }
  .next-tag {
    display: inline-block;
    background: var(--accent); color: #fff;
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
    padding: 2px 7px; border-radius: 3px;
    text-transform: uppercase;
    vertical-align: middle;
  }

  /* WG badges inside a slot. */
  .wg-list {
    display: flex; flex-wrap: wrap; gap: 7px;
    padding: 14px 18px;
  }
  .wg {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 9px 5px 10px;
    border-radius: 6px;
    font-size: 12px; font-weight: 500;
    border-left: 3px solid;
    text-decoration: none;
    transition: filter 0.12s;
  }
  .wg:hover { filter: brightness(0.96); }
  .wg[data-tsg="RAN"] { background: var(--ran-bg); color: var(--ran-fg); border-left-color: var(--ran); }
  .wg[data-tsg="SA"]  { background: var(--sa-bg);  color: var(--sa-fg);  border-left-color: var(--sa); }
  .wg[data-tsg="CT"]  { background: var(--ct-bg);  color: var(--ct-fg);  border-left-color: var(--ct); }
  .wg .wg-name { font-weight: 600; }
  .wg .wg-num  { font-family: 'IBM Plex Mono', monospace; opacity: 0.8; }
  /* invitation status dot */
  .wg .inv {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--wait);
    flex: none;
  }
  .wg.has-folder .inv { background: var(--ok); }
  .wg.no-folder { opacity: 0.72; }

  .legend {
    display: flex; flex-wrap: wrap; gap: 16px;
    margin: 4px 0 22px;
    font-size: 12px; color: var(--muted);
  }
  .legend .item { display: inline-flex; align-items: center; gap: 6px; }
  .legend .sw { width: 12px; height: 12px; border-radius: 3px; border-left: 3px solid; }
  .legend .sw.ran { background: var(--ran-bg); border-left-color: var(--ran); }
  .legend .sw.sa  { background: var(--sa-bg);  border-left-color: var(--sa); }
  .legend .sw.ct  { background: var(--ct-bg);  border-left-color: var(--ct); }
  .legend .dotm { width: 8px; height: 8px; border-radius: 50%; }

  footer {
    max-width: 880px; margin: 0 auto;
    padding: 0 24px 40px;
    color: var(--muted); font-size: 11px; line-height: 1.7;
  }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }

  @media (max-width: 600px) {
    header { padding: 20px 16px 16px; }
    main { padding: 16px 16px 60px; }
    h1 { font-size: 19px; }
    .slot-head { padding: 12px 14px; }
    .wg-list { padding: 12px 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>3GPP Meeting Slots</h1>
    <div class="tagline">
      Upcoming meetings grouped by <b>slot</b> — same city, same week. When any
      working group in a slot posts its invitation, the others usually follow,
      so watch the whole slot, not just one group.
    </div>
    <div class="meta" id="meta">Loading…</div>
  </div>
</header>

<main>

    <span class="item"><span class="dotm" style="background:var(--wait)"></span> not yet</span>
  </div>
  <div id="slots"></div>
</main>

<footer id="footer"></footer>

function tsgOf(groupKey) {
  if (groupKey.startsWith("RAN")) return "RAN";
  if (groupKey.startsWith("SA"))  return "SA";
  if (groupKey.startsWith("CT"))  return "CT";
  return "RAN";
}

function fmtDateRange(start, end) {
  // "2026-11-16" .. "2026-11-20" → "16–20 Nov 2026"; cross-month aware.
  const s = new Date(start + "T00:00:00");
  const e = new Date(end + "T00:00:00");
  const mon = d => d.toLocaleDateString("en-GB", { month: "short" });
  const yr = e.getFullYear();
  if (s.getMonth() === e.getMonth()) {
    return `${s.getDate()}–${e.getDate()} ${mon(e)} ${yr}`;
  }
  return `${s.getDate()} ${mon(s)} – ${e.getDate()} ${mon(e)} ${yr}`;
}

  const meta = document.getElementById("meta");
  const gen = payload.generated
    ? payload.generated.replace("T", " ").replace("Z", " UTC")
    : "—";
  meta.innerHTML =
    `${payload.slot_count} upcoming slots` +
    `<span class="dot">·</span>watching ${payload.watch_scope.length} working groups` +
    `<span class="dot">·</span>updated ${gen}`;

  const container = document.getElementById("slots");
  container.innerHTML = "";

  if (!payload.slots.length) {
    container.innerHTML = '<div class="empty">No upcoming slots found.</div>';
    return;
  }

  // The earliest slot is the "next meeting" — highlight it.
  payload.slots.forEach((slot, idx) => {
    const card = document.createElement("section");
    card.className = "slot" + (idx === 0 ? " next" : "");

    const groupKeys = Object.keys(slot.groups);
    const nextTag = idx === 0 ? ' <span class="next-tag">next</span>' : "";

    const head = document.createElement("div");
    head.className = "slot-head";
    head.innerHTML =
      `<span class="slot-city">${slot.city}${nextTag}</span>` +
      `<span class="slot-dates">${fmtDateRange(slot.start, slot.end)}</span>` +
      `<span class="slot-count">${groupKeys.length} WG${groupKeys.length > 1 ? "s" : ""}</span>`;
    card.appendChild(head);

    const list = document.createElement("div");
    list.className = "wg-list";
    groupKeys.forEach(gk => {
      const info = slot.groups[gk];
      const tsg = tsgOf(gk);
      const hasFolder = !!info.meeting_folder;
      const bisSuffix = info.is_bis ? "bis" : "";
      // Link target: invitation dir if the folder exists, else the WG dir.
      const href = info.invitation_dir || info.meeting_dir || "#";
      const el = document.createElement(hasFolder ? "a" : "span");
      el.className = "wg " + (hasFolder ? "has-folder" : "no-folder");
      el.dataset.tsg = tsg;
      if (hasFolder) {
        el.href = href;
        el.target = "_blank";
        el.rel = "noopener";
        el.title = "Open invitation folder for " + gk;
      } else {
        el.title = "FTP meeting folder not created yet";
      }
      el.innerHTML =
        `<span class="inv"></span>` +
        `<span class="wg-name">${gk}</span>` +
        `<span class="wg-num">#${info.meeting_number}${bisSuffix}</span>`;
      list.appendChild(el);
    });
    card.appendChild(list);
    container.appendChild(card);
  });
}

document.getElementById("footer").innerHTML =
  'Auto-generated daily from the 3GPP meeting registry (dynareport) and FTP archive. ' +
  'A companion watcher checks each slot\u2019s Invitation folder and sends alerts when new files appear. ' +
  'Green dot links go to the live 3GPP Invitation folder.';

render();
</script>
</body>
</html>
