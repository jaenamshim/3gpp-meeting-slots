name: Build meeting slots

# Runs the pairing builder once a day and commits the refreshed
# data.json + index.html. GitHub Actions cron is approximate (it can be
# delayed), which is fine here: the slow-changing schedule data only needs
# a daily refresh. Fast invitation detection is the GCP watcher's job.
on:
  schedule:
    - cron: "17 5 * * *"      # 05:17 UTC daily (odd minute = less contended)
  workflow_dispatch: {}        # allow manual runs from the Actions tab

permissions:
  contents: write              # needed to commit the generated files

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build data.json + index.html
        run: python build.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh meeting slots ($(date -u +%Y-%m-%d))"
            git push
          fi
